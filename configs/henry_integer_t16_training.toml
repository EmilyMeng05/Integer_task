# T16 extension of the frozen T1/T2/T4/T8 training protocol.

protocol_version = "henry-integer-t16/v1"
dataset_protocol_version = "integer-t16/v1"
status = "dataset_verified"
dataset_dir = "data/integer-8m-t16-v1"
dataset_manifest = "data/integer-8m-t16-v1/manifest.json"
output_dir = "runs/henry-integer-t16-v1"
preflight_output_dir = "runs/henry-integer-t16-v1-preflight"
task_order_seed = 20260830
sampling_seed = 20260904
total_records = 8000000
records_per_task = 500000
records_per_task_per_digit_length = 100000
shard_count = 100
records_per_shard = 80000
task_subset_sizes = [16]
architectures = ["transformer", "mlp"]
model_seeds = [17, 42, 314159]

task_order = [
  "decimal_digit_sum",
  "greatest_common_divisor",
  "multiplication",
  "greater_than",
  "integer_list_sum",
  "modulo",
  "addition",
  "successor",
  "subtraction",
  "integer_division",
  "number_of_decimal_digits",
  "reverse_decimal_digits",
  "decimal_digit_occurrence_count",
  "even_odd",
  "divisibility",
  "factorial",
]

holdout_tasks = [
  "predecessor",
  "least_common_multiple",
  "modular_addition",
  "sort_ascending",
]

[data]
base = 100
train_shards = "000-097"
validation_shards = "098"
test_shards = "099"
training_decimal_digits = [1, 2, 3, 4, 5]
ood_decimal_digits = [6, 7, 8, 9, 10]
train_records = 7840000
validation_records = 80000
test_records = 80000
shuffle_buffer = 10000
max_sequence_length = 1024

[model]
d_model = 256
transformer_layers = 4
mlp_layers = 1
num_heads = 8
ff_multiplier = 4
dropout = 0.1
tie_embeddings = true

[training]
max_steps = 20000
micro_batch_size = 16
gradient_accumulation_steps = 4
max_tokens_per_batch = 4096
learning_rate = 0.0003
min_learning_rate_ratio = 0.1
weight_decay = 0.01
warmup_steps = 1000
gradient_clip_norm = 1.0
precision = "bf16"
validate_every_steps = 1000
validation_batches_per_task = 5
checkpoint_every_steps = 1000
num_workers = 0
