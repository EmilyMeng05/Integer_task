protocol_version = "henry-permutation/v1"
dataset_manifest = "data/permutation-10m-v2/manifest.json"
validation_manifest = "data/permutation-10m-v2/manifest.json"
test_manifest = "data/permutation-10m-v2/test_manifest.json"
output_dir = "runs/henry-permutation"
task_order_seed = 20260830
task_subset_sizes = [1, 2, 4, 8, 16]
architectures = ["transformer", "mlp"]
model_seeds = [17, 42, 314159]

# Henry requested that task order be shuffled rather than using the order in
# which tasks were proposed. The final four are complete unseen-task holdouts.
task_order = [
  "power",
  "lis_length",
  "fixed_points",
  "to_inversion_vector",
  "pattern_avoidance",
  "lds_length",
  "right_multiply_simple",
  "conjugate",
  "to_cycle",
  "descents",
  "commutator",
  "length",
  "rsk_shape",
  "inverse",
  "cycle_type",
  "bruhat_leq",
  "to_reduced_word",
  "compose",
  "parity",
  "to_lehmer",
]
holdout_tasks = ["to_reduced_word", "compose", "parity", "to_lehmer"]

[data]
train_shards = "000-097"
validation_shards = "098"
test_shards = "099"
shuffle_buffer = 10000
max_sequence_length = 1024

[model]
# Architecture-specific depths approximately match parameter counts at the
# required 1,024-token context: Transformer 3.46M vs causal MLP 2.93M.
d_model = 256
transformer_layers = 4
mlp_layers = 1
num_heads = 8
ff_multiplier = 4
dropout = 0.1
tie_embeddings = true

[training]
# Every run gets the same optimizer-update budget, so increasing task diversity
# is not confounded with receiving more total updates.
max_steps = 20000
micro_batch_size = 16
gradient_accumulation_steps = 4
max_tokens_per_batch = 4096
learning_rate = 0.0003
min_learning_rate_ratio = 0.1
weight_decay = 0.01
warmup_steps = 1000
gradient_clip_norm = 1.0
precision = "bf16"
validate_every_steps = 1000
validation_batches_per_task = 5
checkpoint_every_steps = 1000
num_workers = 0
