# Frozen eight-task production corpus. This preserves Xuanyu's allocation of
# 500,000 records per task, yielding 4,000,000 records across eight tasks.

protocol_version = "henry-integer/v1"
dataset_protocol_version = "integer-8/v1"
status = "dataset_verified"
dataset_dir = "data/integer-4m-v1"
dataset_manifest = "data/integer-4m-v1/manifest.json"
output_dir = "runs/henry-integer-v1"
preflight_output_dir = "runs/henry-integer-v1-preflight"
task_order_seed = 20260830
sampling_seed = 20260830
total_records = 4000000
records_per_task = 500000
records_per_task_per_digit_length = 100000
shard_count = 100
records_per_shard = 40000
task_subset_sizes = [1, 2, 4, 8]
architectures = ["transformer", "mlp"]
model_seeds = [17, 42, 314159]

task_order = [
  "decimal_digit_sum",
  "greatest_common_divisor",
  "multiplication",
  "greater_than",
  "integer_list_sum",
  "modulo",
  "addition",
  "successor",
]

holdout_tasks = [
  "predecessor",
  "least_common_multiple",
  "modular_addition",
  "sort_ascending",
]

[data]
base = 100
train_shards = "000-097"
validation_shards = "098"
test_shards = "099"
training_decimal_digits = [1, 2, 3, 4, 5]
ood_decimal_digits = [6, 7, 8, 9, 10]
train_records = 3920000
validation_records = 40000
test_records = 40000
shuffle_buffer = 10000
max_sequence_length = 1024

[model]
d_model = 256
transformer_layers = 4
mlp_layers = 1
num_heads = 8
ff_multiplier = 4
dropout = 0.1
tie_embeddings = true

[training]
max_steps = 20000
micro_batch_size = 16
gradient_accumulation_steps = 4
max_tokens_per_batch = 4096
learning_rate = 0.0003
min_learning_rate_ratio = 0.1
weight_decay = 0.01
warmup_steps = 1000
gradient_clip_norm = 1.0
precision = "bf16"
validate_every_steps = 1000
validation_batches_per_task = 5
checkpoint_every_steps = 1000
num_workers = 0
